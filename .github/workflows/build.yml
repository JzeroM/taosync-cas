name: 构建

on:
  push:
    branches: [ 'main' ]
    paths: [ 'version.txt' ]

env:
  APP_NAME: taoSync
  DOCKER_NAME: taosync-cas

jobs:
  # ============================================================
  # 1. 读版本
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vars.outputs.VERSION }}
      VER_NUM: ${{ steps.vars.outputs.VER_NUM }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          RAW=$(cat version.txt | head -n1 | tr -d '\r\n')
          CLEAN="${RAW#v}"
          echo "VERSION=$RAW" >> $GITHUB_OUTPUT
          echo "VER_NUM=$CLEAN" >> $GITHUB_OUTPUT

  # ============================================================
  # 2. 前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          cd web && npm ci && npm run build
      - run: |
          mkdir -p front
          cp -r web/dist/* front/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: front
          retention-days: 1

  # ============================================================
  # 3. Docker（L162 报错重灾区，这里重写最稳的写法）
  # ============================================================
  build-docker:
    name: 构建 Docker
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        env:
          TAG: ${{ needs.get-version.outputs.VERSION }}
        run: |
          # 直接用 Bash 循环打双架构，不玩 matrix/include 的花活
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:$TAG \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:latest \
            .

  # ============================================================
  # 4. Windows
  # ============================================================
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 打包
        shell: pwsh
        run: |
          pip install pyinstaller -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          Compress-Archive -Path dist\* -DestinationPath ${{ env.APP_NAME }}-${{ needs.get-version.outputs.VERSION }}-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: "*.zip"

  # ============================================================
  # 5. macOS
  # ============================================================
  build-darwin:
    name: 构建 Darwin
    runs-on: macos-14
    needs: [get-version, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 打包
        run: |
          pip install pyinstaller -r requirements.txt
          python -m PyInstaller "$APP_NAME.spec"
          cd dist && tar czf ../${{ env.APP_NAME }}-${{ needs.get-version.outputs.VERSION }}-darwin-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: "*.tar.gz"

  # ============================================================
  # 6. Android
  # ============================================================
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VER_NUM: ${{ needs.get-version.outputs.VER_NUM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: |
          rm -rf front && cp -r web/dist front && ls front/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool zlib1g-dev libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk build-essential
          pip install buildozer==1.5.0 python-for-android==2024.01.21 Cython==0.29.34
      - run: |
          cp main_android.py main.py
          sed -i "s/^version = .*/version = $VER_NUM/" buildozer.spec
          buildozer -v android debug
      - run: |
          mkdir -p dist
          cp bin/*.apk "dist/${APP_NAME}-${{ needs.get-version.outputs.VERSION }}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk

  # ============================================================
  # 7. Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-darwin, build-docker, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.VERSION }}
          files: dist/*
