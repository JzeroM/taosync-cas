name: 构建 TaoSync-CAS

on:
  push:
    branches: ["main"]
    paths: ["version.txt"]

env:
  APP_NAME: taoSync
  DOCKER_USER: miuior
  DOCKER_NAME: taosync-cas
  GHCR_USER_LOWER: jzerom

jobs:
  # ============================================================
  # 1. 读取版本号
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.read_ver.outputs.VERSION }}
      IS_STABLE: ${{ steps.read_ver.outputs.IS_STABLE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 version.txt
        id: read_ver
        run: |
          VERSION=$(head -n1 version.txt | tr -d '\r' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # 仅当版本号不包含 dev/pre/beta 时才往 Docker Hub 推正式 tag
          if [[ "$VERSION" =~ (dev|pre|beta) ]]; then
            echo "IS_STABLE=false" >> "$GITHUB_OUTPUT"
          else
            echo "IS_STABLE=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # 2. 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          # 不启用缓存，避免找不到 package-lock.json 导致报错
          cache: ""

      - name: 注入版本号并构建
        run: |
          sed -i "s/__version_placeholder__/$VERSION/g" frontend/src/views/page/setting/index.vue || true
          cd frontend
          npm install
          npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ============================================================
  # 3. 构建并推送 Docker 镜像
  # ============================================================
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 BuildX
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.get-version.outputs.IS_STABLE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 平铺 front/ 目录（兼容原 Dockerfile COPY）
        run: |
          mkdir -p front
          cp -r frontend/dist/* front/

      - name: 推送到 Docker Hub
        if: needs.get-version.outputs.IS_STABLE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:latest
          labels:
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 推送到 GHCR（始终推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_USER_LOWER }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.GHCR_USER_LOWER }}/${{ env.DOCKER_NAME }}:latest
          labels:
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # ============================================================
  # 4. 构建源码包
  # ============================================================
  build-source-packages:
    name: 构建源码包
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 打包
        run: |
          PKG_DIR="taosync-$VERSION"
          mkdir -p "$PKG_DIR/frontend/dist"
          cp -r *.py *.txt *.spec service common controller mapper "$PKG_DIR/" 2>/dev/null || true
          cp -r frontend/dist/* "$PKG_DIR/frontend/dist/"
          ln -snf frontend/dist "$PKG_DIR/front"

          cat > "$PKG_DIR/start.sh" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python main.py
          EOF
          chmod +x "$PKG_DIR/start.sh"

          tar czf "taosync-$VERSION-source.tar.gz" "$PKG_DIR/"

      - name: 上传源码包
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: taosync-${{ env.VERSION }}-source.tar.gz
          retention-days: 5

  # ============================================================
  # 5. 构建 Windows 包
  # ============================================================
  build-windows-package:
    name: 构建 Windows 包
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 打包
        shell: pwsh
        run: |
          $dir = "taosync-$env:VERSION"
          New-Item -ItemType Directory -Force -Path "$dir/frontend/dist" | Out-Null
          Copy-Item *.py,*.txt,*.spec "$dir/" -Force
          Copy-Item service,common,controller,mapper "$dir/" -Recurse -Force
          Copy-Item frontend/dist/* "$dir/frontend/dist/" -Recurse -Force

          'python main.py' | Out-File -FilePath "$dir/run.bat" -Encoding utf8
          Compress-Archive -Path "$dir/*" -DestinationPath "taosync-$env:VERSION-windows-amd64.zip" -Force

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: taosync-${{ env.VERSION }}-windows-amd64.zip
          retention-days: 5

  # ============================================================
  # 6. 构建 macOS 包
  # ============================================================
  build-macos-package:
    name: 构建 macOS 包
    runs-on: macos-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 打包
        run: |
          PKG="taosync-$VERSION"
          mkdir -p "$PKG/frontend/dist"
          cp -r *.py *.txt *.spec "$PKG/"
          cp -r service common controller mapper "$PKG/"
          cp -r frontend/dist/* "$PKG/frontend/dist/"
          ln -snf frontend/dist "$PKG/front"

          printf '#!/bin/bash\ncd "$(dirname "$0")"\npython3 main.py\n' > "$PKG/run.sh"
          chmod +x "$PKG/run.sh"
          tar czf "taosync-$VERSION-macos-universal.tar.gz" "$PKG/"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: taosync-${{ env.VERSION }}-macos-universal.tar.gz
          retention-days: 5

  # ============================================================
  # 7. 创建 GitHub Release
  # ============================================================
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    needs: [get-version, build-docker, build-source-packages, build-windows-package, build-macos-package]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有制品
        uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          merge-multiple: true

      - name: 生成 Release Notes
        run: |
          cat > release_notes.md <<EOF
          ## TaoSync-CAS $VERSION

          ### 🐳 镜像
          - Docker Hub: \`miuior/taosync-cas:$VERSION\`
          - GHCR: \`ghcr.io/jzerom/taosync-cas:$VERSION\`

          ### 📦 预打包
          - Windows (amd64)
          - macOS (universal)
          - Linux 源码包（含前端，自带启动脚本）

          > 本版本为社区魔改分支，同步上游逻辑并保留 CAS 特性。
          EOF

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            taosync-${{ env.VERSION }}-windows-amd64.zip
            taosync-${{ env.VERSION }}-macos-universal.tar.gz
            taosync-${{ env.VERSION }}-source.tar.gz
