name: 构建 TaoSync-CAS

on:
  push:
    branches: ["main"]
    paths: ["version.txt"]

env:
  APP_NAME: taoSync
  DOCKER_USER: miuior
  DOCKER_NAME: taosync-cas
  GHCR_USER_LOWER: jzerom

jobs:
  # ============================================================
  # 1. 读版本
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.read.outputs.VERSION }}
      IS_STABLE: ${{ steps.read.outputs.IS_STABLE }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析 version.txt
        id: read
        run: |
          VER=$(head -n1 version.txt | tr -d '\r' | xargs)
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" =~ (dev|pre|beta) ]]; then
            echo "IS_STABLE=false" >> "$GITHUB_OUTPUT"
          else
            echo "IS_STABLE=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # 2. 构建前端（Vite 默认输出 dist/）
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ""   # 不自动缓存，避免 lock 文件缺失报错

      - name: 注入版本号并构建
        run: |
          if [ -f "index.html" ]; then
            sed -i "s/__version_placeholder__/$VERSION/g" index.html
          fi
          npm install
          npm run build
          # 验证产物：main.py 需要 front/index.html
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 前端构建失败：dist/index.html 不存在"
            exit 1
          fi

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ============================================================
  # 3. 构建并推送 Docker 镜像
  # ============================================================
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.get-version.outputs.IS_STABLE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # —— 关键：给 Dockerfile 里的 /app/front 准备好目录 ——
      - name: 对齐 main.py 的前端路径
        run: |
          mkdir -p front
          cp -r dist/* front/

      - name: 推送到 Docker Hub
        if: needs.get-version.outputs.IS_STABLE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:latest

      - name: 推送到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_USER_LOWER }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.GHCR_USER_LOWER }}/${{ env.DOCKER_NAME }}:latest

  # ============================================================
  # 4. 构建 PyInstaller 单文件（Windows / Linux）
  # ============================================================
  build-executables:
    name: 构建可执行文件
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 对齐 PyInstaller 需要的 front/ 目录
        run: |
          mkdir -p front
          cp -r dist/* front/

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖并打包
        run: |
          pip install -r requirements.txt "pyinstaller>=6,<7"
          pyinstaller --onefile --name taoSync \
            --add-data "front:front" \
            --icon=logo.ico main.py

      - name: 上传 Linux 单文件
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/taoSync

  # ============================================================
  # 5. 创建 Release
  # ============================================================
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    needs: [get-version, build-docker, build-executables]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载可执行文件
        uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: 打包 Linux CLI
        run: |
          chmod +x taoSync
          tar czf taosync-cas-${{ env.VERSION }}-linux-amd64.tar.gz taoSync

      - name: 生成 Release Notes
        run: |
          cat > notes.md <<EOF
          ## TaoSync-CAS $VERSION

          - 🐳 Docker Hub: \`miuior/taosync-cas:$VERSION\`
          - 📦 GHCR: \`ghcr.io/jzerom/taosync-cas:$VERSION\`
          - 🐧 Linux 单文件（无需 Python 环境）

          > 社区魔改分支，保留 CAS 联动特性。
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body_path: notes.md
          files: |
            taosync-cas-${{ env.VERSION }}-linux-amd64.tar.gz
