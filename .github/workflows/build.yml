name: 构建

on:
  push:
    branches: [ 'main' ]
    paths: [ 'version.txt' ]

env:
  APP_NAME: taoSync
  DOCKER_USER: miuior
  DOCKER_NAME: taosync-cas

jobs:
  # ============================================================
  # 1. 读版本
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      TAG_LIST: ${{ steps.getVersion.outputs.TAG_LIST }}
      VERSION: ${{ steps.getVersion.outputs.VERSION }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - id: getVersion
        name: 解析 version.txt
        run: |
          versions=$(head -n 1 version.txt)
          tagList=""
          IFS=',' read -ra versionList <<< "$versions"
          cuVersion="${versionList[0]}"
          for version in "${versionList[@]}"; do
            tagList+="-t $DOCKER_USER/$DOCKER_NAME:$version "
          done
          echo "TAG_LIST=$tagList" >> "$GITHUB_OUTPUT"
          echo "VERSION=$cuVersion" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2. 构建前端（对齐原版 main.py 的 front/）
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [ get-version ]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 对齐前端目录
        run: |
          mkdir -p front
          cp -r web/dist/* front/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: front
          retention-days: 1

  # ============================================================
  # 3. 构建多架构 Docker 镜像
  # ============================================================
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [ get-version, build-frontend ]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/386
          - linux/arm/v6
          - linux/s390x
          - linux/ppc64le

    steps:
      - name: 替换平台名中的斜杠
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: 设置 QEMU & BuildX
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - id: build-image
        name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: |
            type=docker
            type=image,name=${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-image.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge-docker:
    name: 合并 Docker 镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-docker]
    env:
      TAG_LIST: ${{ needs.get-version.outputs.TAG_LIST }}
    steps:
      - name: 下载 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 推送多架构清单
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ env.TAG_LIST }}$(printf '${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}@sha256:%s ' *)

  # ============================================================
  # 4. Windows
  # ============================================================
  build-windows:
    name: 构建 Windows
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - name: 判断平台
        shell: pwsh
        run: |
          if ("${{ matrix.os }}" -eq "windows-latest") { echo "PLATFORM=amd64" >> $env:GITHUB_ENV } else { echo "PLATFORM=arm64" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 打包
        shell: pwsh
        run: |
          python -m pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          cd dist; 7z a ${{ env.APP_NAME }}-${{ env.VERSION }}-windows-${{ env.PLATFORM }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ env.PLATFORM }}
          path: dist/*.zip

  # ============================================================
  # 5. macOS
  # ============================================================
  build-darwin:
    name: 构建 Darwin
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - name: 判断平台
        run: |
          if [[ "${{ matrix.os }}" == *intel* ]]; then
            echo "PLATFORM=amd64" >> $GITHUB_ENV
          else
            echo "PLATFORM=arm64" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 打包
        run: |
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller "$APP_NAME.spec"
          cd dist && tar czf "$APP_NAME-$VERSION-darwin-$PLATFORM.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ env.PLATFORM }}
          path: dist/*.tar.gz

  # ============================================================
  # 6. Linux StaticX
  # ============================================================
  build-staticx:
    name: 构建 Linux StaticX
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    strategy:
      matrix:
        platform: ["amd64", "arm64", "arm32"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 设置架构变量
        run: |
          case "${{ matrix.platform }}" in
            amd64) echo "T_ARCH=amd64;LIB=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV ;;
            arm64) echo "T_ARCH=arm64;LIB=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV ;;
            arm32) echo "T_ARCH=arm/v7;LIB=/usr/lib/arm-linux-gnueabihf" >> $GITHUB_ENV ;;
          esac

      - name: Docker 内静态打包
        env:
          MATRIX: ${{ matrix.platform }}
        run: |
          IMG="python:3.11-slim-bullseye"
          [[ "${{ matrix.platform }}" == arm* ]] && IMG="arm32v7/${IMG}" || true
          [[ "${{ matrix.platform }}" == arm64 ]] && IMG="arm64v8/${IMG}" || true
          docker run --rm --platform linux/${T_ARCH} -v $PWD:/app -w /app \
            -e APP_NAME=${APP_NAME} -e LIB_PATH=${LIB} ${IMG} sh -c '
              apt-get update && apt-get install -y build-essential zlib1g-dev patchelf binutils zip
              pip install --upgrade pip && pip install "pyinstaller>=6,<7" staticx -r requirements.txt
              pyinstaller ${APP_NAME}.spec --distpath dist/${MATRIX} --noconfirm
              staticx dist/${MATRIX}/${APP_NAME} dist/${MATRIX}/${APP_NAME}_sx
              mv dist/${MATRIX}/${APP_NAME}_sx dist/${MATRIX}/${APP_NAME}
            '

      - name: 压缩产物
        run: |
          cd dist/${{ matrix.platform }}
          zip -r ../../${APP_NAME}-${VERSION}-linux-StaticX-${{ matrix.platform }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-staticx-${{ matrix.platform }}
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}-linux-StaticX-${{ matrix.platform }}.zip

  # ============================================================
  # 7. Android
  # ============================================================
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: 对齐前端
        run: |
          rm -rf front
          cp -r web/dist front
          test -f front/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装安卓依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev openjdk-17-jdk build-essential
          pip install buildozer==1.5.0 python-for-android==2024.01.21 Cython==0.29.34

      - name: 注入版本并编译
        run: |
          cp main_android.py main.py
          ver_num="${VERSION#v}"
          sed -i "s/^version = .*/version = $ver_num/" buildozer.spec
          buildozer -v android debug

      - name: 整理产物
        run: |
          mkdir -p dist
          cp bin/*.apk "dist/${APP_NAME}-${VERSION}-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk

  # ============================================================
  # 8. 发布 Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-darwin, build-docker, build-staticx, build-android]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: 生成 changelog
        run: |
          version_base="${VERSION%%-*}"
          LOG="doc/changelog/$version_base.md"
          if [ ! -f "$LOG" ]; then
            echo "$VERSION 自动构建发布" > "$LOG"
          fi
          echo "LOG=$LOG" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          body_path: ${{ env.LOG }}
          prerelease: false
