name: 构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: taoSync

jobs:
  # ============================================================
  # 0. 获取版本号
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.read_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本
        id: read_version
        run: |
          VERSION=$(cat version.txt | tr -d '\n\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "当前版本: $VERSION"

  # ============================================================
  # 1. 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: 安装并构建
        working-directory: ./web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # ============================================================
  # 2. Docker 镜像 (修正了矩阵架构)
  # ============================================================
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    strategy:
      matrix:
        # 修复：移除了极易失败的 linux/386 和 s390x，保留主流架构
        platform: [linux/amd64, linux/arm64, linux/arm/v7, linux/ppc64le]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}

  # ============================================================
  # 3. Windows
  # ============================================================
  build-windows:
    name: 构建 Windows (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: [get-version, build-frontend]
    strategy:
      matrix:
        platform: [windows-latest, windows-11-arm]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      PLATFORM: ${{ matrix.platform == 'windows-11-arm' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ env.PLATFORM }}
      - name: 安装依赖并打包
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          Compress-Archive -Path dist/* -DestinationPath "${{ env.APP_NAME }}-${{ env.VERSION }}-windows-${{ env.PLATFORM }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ env.PLATFORM }}
          # 修复：修正了之前的拼写错误 PLATFROM -> PLATFORM
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}-windows-${{ env.PLATFORM }}.zip

  # ============================================================
  # 4. macOS
  # ============================================================
  build-darwin:
    name: 构建 Darwin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [get-version, build-frontend]
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 判断平台
        run: |
          if [[ "${{ matrix.os }}" == *intel* ]]; then
            echo "PLATFORM=amd64" >> $GITHUB_ENV
          else
            echo "PLATFORM=arm64" >> $GITHUB_ENV
          fi
      - name: 安装依赖并打包
        run: |
          pip install --upgrade pip
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          cd dist && zip -r ../${{ env.APP_NAME }}-${{ env.VERSION }}-darwin-${{ env.PLATFORM }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ env.PLATFORM }}
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}-darwin-${{ env.PLATFORM }}.zip

  # ============================================================
  # 5. Linux StaticX
  # ============================================================
  build-staticx:
    name: 构建 Linux StaticX (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    strategy:
      matrix:
        platform: [amd64, arm64, arm32]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖并打包
        run: |
          pip install --upgrade pip
          pip install pyinstaller staticx -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          staticx dist/${{ env.APP_NAME }} dist/${{ env.APP_NAME }}_sx
          mv dist/${{ env.APP_NAME }}_sx dist/${{ env.APP_NAME }}
          cd dist && zip -r ../${{ env.APP_NAME }}-${{ env.VERSION }}-linux-staticx-${{ matrix.platform }}.zip ${{ env.APP_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-staticx-${{ matrix.platform }}
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}-linux-staticx-${{ matrix.platform }}.zip

  # ============================================================
  # 6. Android
  # ============================================================
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: 对齐前端
        run: |
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装安卓依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev openjdk-17-jdk build-essential
          pip install buildozer==1.5.0 python-for-android==2024.01.21 Cython==0.29.34
      - name: 注入版本并编译
        run: |
          cp main_android.py main.py
          ver_num="${VERSION#v}"
          sed -i "s/^version = .*/version = $ver_num/" buildozer.spec
          buildozer -v android debug
      - name: 整理产物
        run: |
          mkdir -p dist
          cp bin/*.apk "dist/${{ env.APP_NAME }}-${{ env.VERSION }}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk

  # ============================================================
  # 7. 发布 Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-darwin, build-docker, build-staticx, build-android]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 生成 changelog
        run: |
          version_base="${VERSION%%-*}"
          LOG="doc/changelog/$version_base.md"
          if [ ! -f "$LOG" ]; then
            echo "$VERSION 自动构建发布" > "$LOG"
          fi
          echo "LOG=$LOG" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          body_path: ${{ env.LOG }}
          prerelease: false
