name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # 1. 获取版本号
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # ============================================================
  # 2. 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 假设你有前端构建步骤，这里省略 npm/yarn 构建
      - name: 模拟前端构建
        run: |
          mkdir -p web/dist
          echo "<html>Hello</html>" > web/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # ============================================================
  # 3. 构建 Windows (示例)
  # ============================================================
  build-windows:
    name: 构建Windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      APP_NAME: YourAppName
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 对齐前端目录
        run: |
          rm -rf front
          cp -r web/dist front
      - name: 打包
        run: |
          python -m pip install pyinstaller -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          mkdir -p dist
          7z a ${{ env.APP_NAME }}-${{ env.VERSION }}-windows-amd64.zip dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/*.zip

  # ============================================================
  # 4. 构建 Docker (示例)
  # ============================================================
  build-docker:
    name: 构建Docker
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t your-image:${{ needs.get-version.outputs.VERSION }} .

  # ============================================================
  # 5. 构建 Android (终极修复版)
  # ============================================================
  build-android:
    name: 构建Android
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      APP_NAME: YourAppName
    steps:
      - uses: actions/checkout@v4
      
      # 下载前端
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
          
      # 对齐目录
      - name: 对齐前端目录
        run: |
          rm -rf front
          cp -r web/dist front
          test -f front/index.html || (echo "Frontend missing!" && exit 1)

      # 设置 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 安装系统依赖 (关键：清理旧 JDK，确保只有 JDK 17)
      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get remove -y openjdk-11-jdk openjdk-8-jdk || true # 强制移除旧版，防止冲突
          sudo apt-get install -y -qq \
            autoconf automake libtool zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev openjdk-17-jdk build-essential git zip unzip \
            python3-dev python3-pip python3-setuptools

      # 安装 Python 依赖
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 python-for-android==2024.01.21 Cython==0.29.34

      # 关键步骤：初始化并编译
      - name: 注入版本并编译 (开启最高日志级别)
        working-directory: ${{ github.workspace }}
        run: |
          # 1. 准备文件
          cp main_android.py main.py
          ver_num="${VERSION#v}"
          sed -i "s/^version = .*/version = $ver_num/" buildozer.spec
          
          echo ">>> 强制清理旧构建缓存..."
          rm -rf .buildozer
          
          echo ">>> 强制初始化 Android 工具链..."
          # 使用绝对路径执行，并开启最高级别日志
          /opt/hostedtoolcache/Python/3.11.15/x64/bin/buildozer -vv android update
          
          echo ">>> 开始编译 APK..."
          # -vv 是关键，会打印出具体的 Cython/Java 编译错误
          /opt/hostedtoolcache/Python/3.11.15/x64/bin/buildozer -vv android debug

      # 收集产物 (无论成功与否都尝试收集，用于排查)
      - name: 收集产物
        if: always() # 即使编译失败也运行
        run: |
          mkdir -p dist
          # 查找生成的 APK
          find . -name "*.apk" -exec cp {} dist/ \; || echo "APK not found, check logs above."
          
      # 上传产物
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-android
          path: dist/

  # ============================================================
  # 6. 发布 Release
  # ============================================================
  create-release:
    name: 发布release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-docker, build-android]
    env:
      VERSION: ${{needs.get-version.outputs.VERSION}}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 生成 changelog
        run: |
          version_base="${VERSION%%-*}"
          LOG="doc/changelog/$version_base.md"
          if [ ! -f "$LOG" ]; then
            echo "$VERSION 自动构建发布" > "$LOG"
          fi
          echo "LOG=$LOG" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/**
          body_path: ${{ env.LOG }}
          prerelease: false
