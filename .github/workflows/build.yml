name: 构建

on:
  push:
    branches: [ 'main' ]
    paths: [ 'version.txt' ]

env:
  APP_NAME: taoSync
  DOCKER_USER: miuior
  DOCKER_NAME: taosync-cas

jobs:
  # ============================================================
  # 1. 读版本
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      TAG_LIST: ${{ steps.getVersion.outputs.TAG_LIST }}
      VERSION: ${{ steps.getVersion.outputs.VERSION }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - id: getVersion
        name: 解析 version.txt
        run: |
          versions=$(head -n 1 version.txt)
          tagList=""
          IFS=',' read -ra versionList <<< "$versions"
          cuVersion="${versionList[0]}"
          for version in "${versionList[@]}"; do
            tagList+="-t $DOCKER_USER/$DOCKER_NAME:$version "
          done
          echo "TAG_LIST=$tagList" >> "$GITHUB_OUTPUT"
          echo "VERSION=$cuVersion" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2. 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [ get-version ]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 对齐前端目录
        run: |
          mkdir -p front
          cp -r web/dist/* front/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: front
          retention-days: 1

  # ============================================================
  # 3. Docker
  # ============================================================
  build-docker:
    name: 构建Docker与linux
    runs-on: ubuntu-latest
    needs: [ get-version, build-frontend ]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: 替换平台名中的斜杠
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: 设置 QEMU & BuildX
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - id: build-image
        name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: |
            type=docker
            type=image,name=${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-image.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge-docker:
    name: 合并Docker镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-docker]
    env:
      TAG_LIST: ${{ needs.get-version.outputs.TAG_LIST }}
    steps:
      - name: 下载 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 推送多架构清单
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ env.TAG_LIST }}$(printf '${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}@sha256:%s ' *)

  # ============================================================
  # 4. Windows（COLLECT 目录模式，彻底解决 1455 报错）
  # ============================================================
  build-windows:
    name: 构建windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - name: 标记平台
        shell: pwsh
        run: echo "PLATFORM=amd64" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 打包
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          cd dist
          7z a ../${{ env.APP_NAME }}-${{ env.VERSION }}-windows-amd64.zip taoSync/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}-windows-amd64.zip

  # ============================================================
  # 5. 发布 Release
  # ============================================================
  create-release:
    name: 发布release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-docker]
    env:
      VERSION: ${{needs.get-version.outputs.VERSION}}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 生成 changelog
        run: |
          version_base="${VERSION%%-*}"
          LOG="doc/changelog/$version_base.md"
          if [ ! -f "$LOG" ]; then
            echo "$VERSION 自动构建发布" > "$LOG"
          fi
          echo "LOG=$LOG" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/**
          body_path: ${{ env.LOG }}
