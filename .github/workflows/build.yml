name: 构建

on:
  push:
    branches: [ 'main' ]
    paths: [ 'version.txt' ]

env:
  APP_NAME: taoSync
  DOCKER_NAME: taosync-cas

jobs:
  # ============================================================
  # 1. 读版本
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.getVersion.outputs.VERSION }}
      VER_NUM: ${{ steps.getVersion.outputs.VER_NUM }}

    steps:
      - uses: actions/checkout@v4
      - id: getVersion
        run: |
          raw=$(head -n 1 version.txt | tr -d '\r')
          clean="${raw#v}"
          echo "VERSION=$raw" >> "$GITHUB_OUTPUT"
          echo "VER_NUM=$clean" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2. 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [ get-version ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装并构建
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: 对齐目录
        run: |
          mkdir -p front
          cp -r web/dist/* front/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: front
          retention-days: 1

  # ============================================================
  # 3. Docker（标准顺序：Setup → Checkout → Login → Push）
  # ============================================================
  build-docker:
    name: 构建 Docker
    runs-on: ubuntu-latest
    needs: [ get-version, build-frontend ]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_arch: amd64
          - platform: linux/arm64
            tag_arch: arm64
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    steps:
      # 1️⃣ 先起构建环境
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 2️⃣ 再拉代码和产物
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: front

      # 3️⃣ 登录（此时 BuildX 已就绪，不会抢跑报 scope 错）
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ 构建并推送
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-${{ matrix.tag_arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_NAME }}:latest

  # ============================================================
  # 4. Windows（仅 x64）
  # ============================================================
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: front }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 打包
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller ${{ env.APP_NAME }}.spec
          cd dist; 7z a ${{ env.APP_NAME }}-${{ env.VERSION }}-windows-amd64.zip *
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows, path: dist/*.zip }

  # ============================================================
  # 5. macOS
  # ============================================================
  build-darwin:
    name: 构建 Darwin
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - name: 判断平台
        run: |
          if [[ "${{ matrix.os }}" == *intel* ]]; then
            echo "PLATFORM=amd64" >> $GITHUB_ENV
          else
            echo "PLATFORM=arm64" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: front }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 打包
        run: |
          pip install 'pyinstaller>=6,<7' -r requirements.txt
          python -m PyInstaller "$APP_NAME.spec"
          cd dist && tar czf "$APP_NAME-$VERSION-darwin-$PLATFORM.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: dist-darwin-${{ env.PLATFORM }}, path: dist/*.tar.gz }

  # ============================================================
  # 6. Android
  # ============================================================
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      VER_NUM: ${{ needs.get-version.outputs.VER_NUM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: 对齐前端
        run: |
          rm -rf front && cp -r web/dist front && test -f front/index.html
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev openjdk-17-jdk build-essential
          pip install buildozer==1.5.0 python-for-android==2024.01.21 Cython==0.29.34
      - name: 注入版本并编译
        run: |
          cp main_android.py main.py
          sed -i "s/^version = .*/version = $VER_NUM/" buildozer.spec
          buildozer -v android debug
      - name: 整理产物
        run: |
          mkdir -p dist
          cp bin/*.apk "dist/${APP_NAME}-${VERSION}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with: { name: dist-android, path: dist/*.apk }

  # ============================================================
  # 7. Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-darwin, build-docker, build-android]
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    if: ${{ !contains(needs.get-version.outputs.VERSION, 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: dist-*, path: dist, merge-multiple: true }
      - name: changelog
        run: |
          base="${VERSION%%-*}"
          LOG="doc/changelog/$base.md"
          [ -f "$LOG" ] || echo "$VERSION 自动构建" > "$LOG"
          echo "LOG=$LOG" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          body_path: ${{ env.LOG }}
